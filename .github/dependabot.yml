version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: '12 4 8 * *'
      timezone: Europe/Berlin
    cooldown:
          default: 7
    open-pull-requests-limit: 15
    assignees:
      - webbummler
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: '12 4 8 * *'
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - webbummler
